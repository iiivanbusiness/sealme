[package]
name = "sealme-desktop"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Named to match `productName` in tauri.conf.json (spaces stripped) rather
# than the Cargo package name — `tauri build`'s own bundler renames the
# binary to this for the .msi/.exe outputs, but tools that build the raw
# binary directly (e.g. `cargo build`/`tauri build --no-bundle`, used by the
# MSIX packaging tool in package.json's `tauri:windows:build`) need it to
# already come out of Cargo with this name, since they never run that rename
# step.
name = "SealMe"
path = "src/main.rs"

[features]
# Mac App Store builds can't self-update — Apple requires updates to go
# through the Store, so this feature compiles the updater plugin/check out
# entirely instead of just leaving it unconfigured. Direct-distribution
# builds (npm run tauri build) don't pass this, so they keep updating as
# before. Also gates the companion panel's native vibrancy effect out (see
# the macos-private-api feature below) for the same review-risk reason —
# the Rust code behind `not(feature = "mas")` simply never calls
# WebviewWindowBuilder::transparent()/effects() for that build.
mas = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri-build's config/feature consistency check (tauri-build's manifest.rs
# `check_features`) parses the `tauri` dependency's `features = [...]` list
# straight off this file's TEXT and compares it against what the ACTIVE
# tauri.conf.json requires — tauri.conf.json (direct distribution) sets
# macOSPrivateApi: true, so it wants this feature present; the MAS override
# (tauri.macos-mas.conf.json) sets it false, so it wants this feature
# absent. It reads the manifest directly, not Cargo's resolved feature
# graph, so no `--features`/`default`/forwarding-feature trick on this line
# can satisfy both at once — confirmed by reading manifest.rs, not
# guessed. `features = ["macos-private-api"]` here is therefore only
# correct for the direct-distribution build; `scripts/build-mas.sh` is the
# only supported way to build the MAS variant — it flips this line off,
# builds, and restores it, so this file never has to be hand-edited (and
# never gets left broken/uncommitted mid-edit, which is what happened
# before this comment was written).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
# WASAPI bindings for local call capture on Windows (see src/audio_windows.rs)
# — the loopback-capture equivalent of the ScreenCaptureKit bridge macOS uses.
wasapi = "0.24"

